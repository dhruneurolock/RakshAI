# Memgraph Graph Database for RakshAI/NeuroPentWeb
# Start with: docker-compose -f docker-compose.memgraph.yml up -d
#
# Memgraph is a drop-in replacement for Neo4j.
# It uses the same Bolt protocol (port 7687) and Cypher query language.
# The neo4j Python driver connects to it without any code changes.
#
# Web UI (Memgraph Lab): http://localhost:3000
# Bolt endpoint:         bolt://localhost:7687

version: "3.8"

services:
  memgraph:
    image: memgraph/memgraph-platform:latest
    container_name: raksh_memgraph
    ports:
      - "7687:7687"   # Bolt protocol (same as Neo4j)
      - "3000:3000"   # Memgraph Lab web UI
      - "7444:7444"   # Memgraph log streaming
    volumes:
      - memgraph_data:/var/lib/memgraph
      - memgraph_log:/var/log/memgraph
    environment:
      - MEMGRAPH_USER=
      - MEMGRAPH_PASSWORD=
    restart: unless-stopped

volumes:
  memgraph_data:
  memgraph_log:
