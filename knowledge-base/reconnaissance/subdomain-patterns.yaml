# ===== SUBDOMAIN TAKEOVER SIGNATURES =====
takeover_signatures:
  - cname: "*.s3.amazonaws.com"
    indicator: "NoSuchBucket"
    service: "AWS S3"
    exploitable: true

  - cname: "*.herokuapp.com"
    indicator: "No such app"
    service: "Heroku"
    exploitable: true

  - cname: "*.ghost.io"
    indicator: "Site not found"
    service: "Ghost"
    exploitable: true

  - cname: "*.github.io"
    indicator: "There isn't a GitHub Pages site"
    service: "GitHub Pages"
    exploitable: true

  - cname: "*.azurewebsites.net"
    indicator: "404 Web Site not found"
    service: "Azure"
    exploitable: true

  - cname: "*.cloudfront.net"
    indicator: "Bad Request"
    service: "AWS CloudFront"
    exploitable: true

  - cname: "*.shopify.com"
    indicator: "Sorry, this shop is currently unavailable"
    service: "Shopify"
    exploitable: true

  - cname: "*.zendesk.com"
    indicator: "Help Center Closed"
    service: "Zendesk"
    exploitable: true

  - cname: "*.surge.sh"
    indicator: "project not found"
    service: "Surge.sh"
    exploitable: true

  - cname: "*.netlify.app"
    indicator: "Not Found - Request ID"
    service: "Netlify"
    exploitable: true

# ===== ENUMERATION TOOLS =====
tools:
  passive:
    - "subfinder -d target.com -o subdomains.txt"
    - "amass enum -passive -d target.com"
    - "assetfinder --subs-only target.com"
    - "crt.sh: https://crt.sh/?q=%.target.com"
    - "SecurityTrails API"
    - "Shodan: ssl.cert.subject.cn:target.com"

  active:
    - "gobuster dns -d target.com -w wordlist.txt"
    - "ffuf -u http://FUZZ.target.com -w wordlist.txt"
    - "dnsrecon -d target.com -t brt"
    - "massdns -r resolvers.txt -t A -o S -w results.txt domains.txt"

  takeover:
    - "subjack -w subdomains.txt -a -ssl -t 20 -v"
    - "nuclei -l subdomains.txt -t takeovers/"
    - "can-i-take-over-xyz (reference list)"
