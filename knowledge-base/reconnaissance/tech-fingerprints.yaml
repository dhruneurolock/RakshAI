# Technology Fingerprinting Signatures
# A red teamer's first move: know what you're attacking
# These patterns identify the tech stack from HTTP headers, cookies, and HTML

recon_category: "tech-fingerprinting"
version: "1.0"

# ===== HTTP HEADER FINGERPRINTS =====
header_fingerprints:
  server_header:
    - pattern: "Apache/\\d"
      tech: "Apache HTTP Server"
      action: "Check for mod_status, mod_info, .htaccess misconfiguration"
    - pattern: "nginx/\\d"
      tech: "Nginx"
      action: "Check for nginx.conf exposure, alias traversal"
    - pattern: "Microsoft-IIS/\\d"
      tech: "IIS"
      action: "Check for web.config, short filename brute force, tilde enum"
    - pattern: "cloudflare"
      tech: "Cloudflare WAF"
      action: "Use WAF bypass techniques, find origin IP"
    - pattern: "gunicorn"
      tech: "Python (Gunicorn)"
      action: "Check for Django/Flask, SSTI, debug mode"
    - pattern: "Werkzeug"
      tech: "Flask/Werkzeug (Python)"
      action: "Check /console for debug RCE, SSTI"
    - pattern: "Kestrel"
      tech: ".NET Core (Kestrel)"
      action: "Check for deserialization, ViewState"
    - pattern: "Express"
      tech: "Node.js Express"
      action: "Check for prototype pollution, SSTI in EJS/Pug"
    - pattern: "Phusion Passenger"
      tech: "Ruby on Rails"
      action: "Check for mass assignment, SSTI in ERB"

  powered_by:
    - pattern: "X-Powered-By: PHP/\\d"
      tech: "PHP"
      action: "Check for LFI, type juggling, deserialization"
    - pattern: "X-Powered-By: ASP.NET"
      tech: "ASP.NET"
      action: "Check for ViewState deserialization, padding oracle"
    - pattern: "X-Powered-By: Express"
      tech: "Node.js Express"
    - pattern: "X-Powered-By: Next.js"
      tech: "Next.js (React)"
    - pattern: "X-Powered-By: Servlet"
      tech: "Java Servlet"
      action: "Check for Java deserialization, OGNL injection"

  framework_headers:
    - pattern: "X-Django-Version"
      tech: "Django"
    - pattern: "X-Drupal-Cache"
      tech: "Drupal"
    - pattern: "X-Generator: Drupal"
      tech: "Drupal"
    - pattern: "X-Varnish"
      tech: "Varnish Cache"
      action: "Check for cache poisoning"
    - pattern: "X-AspNet-Version"
      tech: "ASP.NET"
    - pattern: "X-AspNetMvc-Version"
      tech: "ASP.NET MVC"

# ===== COOKIE FINGERPRINTS =====
cookie_fingerprints:
  - pattern: "PHPSESSID"
    tech: "PHP"
  - pattern: "JSESSIONID"
    tech: "Java (Tomcat/Spring)"
  - pattern: "ASP.NET_SessionId"
    tech: "ASP.NET"
  - pattern: "csrftoken"
    tech: "Django"
  - pattern: "laravel_session"
    tech: "Laravel (PHP)"
  - pattern: "rack.session"
    tech: "Ruby (Rack/Rails)"
  - pattern: "connect.sid"
    tech: "Node.js Express"
  - pattern: "_rails_session"
    tech: "Ruby on Rails"
  - pattern: "wordpress_logged_in"
    tech: "WordPress"
  - pattern: "wp-settings"
    tech: "WordPress"
  - pattern: "Drupal.visitor"
    tech: "Drupal"
  - pattern: "__cfduid"
    tech: "Cloudflare"
  - pattern: "AWSALB"
    tech: "AWS ALB"
  - pattern: "AWSALBCORS"
    tech: "AWS ALB (CORS)"

# ===== HTML / META FINGERPRINTS =====
html_fingerprints:
  meta_generator:
    - pattern: "WordPress \\d+\\.\\d+"
      tech: "WordPress"
      action: "Run wpscan, check for vulnerable plugins"
    - pattern: "Drupal \\d+"
      tech: "Drupal"
    - pattern: "Joomla"
      tech: "Joomla"
    - pattern: "Shopify"
      tech: "Shopify"

  javascript_frameworks:
    - pattern: "__NEXT_DATA__"
      tech: "Next.js"
    - pattern: "ng-app|ng-controller"
      tech: "AngularJS (v1 — client-side template injection)"
      action: "Test for AngularJS sandbox bypass XSS"
    - pattern: "ng-version"
      tech: "Angular (v2+)"
    - pattern: "data-reactroot"
      tech: "React"
    - pattern: "__vue__"
      tech: "Vue.js"
    - pattern: "data-svelte"
      tech: "Svelte"
    - pattern: "__NUXT__"
      tech: "Nuxt.js"
    - pattern: "ember-view"
      tech: "Ember.js"

  cms_paths:
    - pattern: "/wp-content/"
      tech: "WordPress"
    - pattern: "/wp-includes/"
      tech: "WordPress"
    - pattern: "/sites/default/files"
      tech: "Drupal"
    - pattern: "/media/system/"
      tech: "Joomla"
    - pattern: "/typo3/"
      tech: "TYPO3"

# ===== ERROR PAGE FINGERPRINTS =====
error_fingerprints:
  - pattern: "Whitelabel Error Page"
    tech: "Spring Boot (Java)"
    action: "Check /actuator endpoints"
  - pattern: "Django.*Debug.*True"
    tech: "Django (DEBUG=True)"
    action: "CRITICAL: Full source code + SQL + settings exposed"
  - pattern: "Traceback.*most recent call"
    tech: "Python"
  - pattern: "Fatal error.*on line \\d+"
    tech: "PHP"
  - pattern: "Stack Trace.*System\\.Web"
    tech: "ASP.NET"
  - pattern: "Rails.*ActionController"
    tech: "Ruby on Rails"
  - pattern: "Werkzeug Debugger"
    tech: "Flask (Werkzeug)"
    action: "CRITICAL: Interactive Python console — RCE possible"
  - pattern: "Cannot GET /"
    tech: "Node.js Express"
  - pattern: "ENOENT.*no such file"
    tech: "Node.js"

# ===== WAF DETECTION =====
waf_detection:
  - pattern: "cloudflare"
    waf: "Cloudflare"
    bypass_ref: "payloads/injection/xss.yaml#waf_bypass#cloudflare"
  - pattern: "__cfduid|cf-ray"
    waf: "Cloudflare"
  - pattern: "X-Sucuri-ID"
    waf: "Sucuri"
  - pattern: "X-CDN: Imperva"
    waf: "Imperva/Incapsula"
  - pattern: "AkamaiGHost"
    waf: "Akamai"
  - pattern: "X-Protected-By: Sqreen"
    waf: "Sqreen"
  - pattern: "X-DistilID"
    waf: "Distil Networks"
  - pattern: "X-Denied-Reason"
    waf: "ModSecurity"
  - pattern: "mod_security"
    waf: "ModSecurity"
  - pattern: "AWSWAF"
    waf: "AWS WAF"

# ===== TECH STACK → ATTACK MAP =====
tech_to_attack_mapping:
  PHP:
    - "LFI (php://filter, php://input)"
    - "Type juggling (== vs ===)"
    - "Deserialization (unserialize)"
    - "File upload bypass"
  Java:
    - "Deserialization (ysoserial)"
    - "OGNL/EL injection"
    - "Log4Shell"
    - "Spring4Shell"
  Python:
    - "SSTI (Jinja2)"
    - "Pickle deserialization"
    - "Django debug mode"
  Node_js:
    - "Prototype pollution"
    - "SSRF via request library"
    - "Template injection (EJS, Pug)"
  Ruby:
    - "Mass assignment"
    - "SSTI (ERB)"
    - "Deserialization (Marshal.load)"
  dotNET:
    - "ViewState deserialization"
    - "Padding oracle"
    - "XXE in XML parsers"
